<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Flask App First</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Form Flask App First<h1>
    <form action="/greet" method="POST">
        <input type="text" name="name" placeholder="Masukkan nama kamu di sini, yah." required>
        <button type="submit">Kirim</button>
    </form>
    {% if hasil %}
        <p>{{ hasil }}</p>
    {% endif %}
</body>
</html>
